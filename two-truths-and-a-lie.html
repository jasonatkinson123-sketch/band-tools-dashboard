<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Two Truths & a Lie | General Music</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet"><style>
:root{--navy:#10172f;--yellow:#ffd447;--cyan:#5de4e7;--pink:#ff73a9}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:white;background:var(--navy);background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px),radial-gradient(ellipse at 50% 0,#2c3e72,transparent 70%);background-size:32px 32px,32px 32px,auto;font-family:'VT323',monospace}.shell{max-width:1400px;margin:auto;padding:22px 24px 36px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.back{color:var(--cyan);text-decoration:none;font:10px/1.7 'Press Start 2P',monospace;border:3px solid var(--cyan);padding:12px}.count{color:var(--yellow);font:11px 'Press Start 2P',monospace}h1{text-align:center;color:var(--yellow);text-shadow:5px 5px #623e81;font:clamp(22px,3.6vw,43px)/1.6 'Press Start 2P',monospace;margin:24px 0 4px}.sub{text-align:center;color:#cbd7ee;font-size:clamp(24px,2.5vw,32px);margin:0 0 22px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.choice{border:5px solid white;min-height:clamp(250px,40vh,450px);padding:22px 18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:30px;box-shadow:8px 8px #070b19;cursor:pointer;background:#2a4d80;color:white}.choice:nth-child(2){background:#6c3f78}.choice:nth-child(3){background:#216a70}.letter{font:clamp(18px,2vw,30px) 'Press Start 2P',monospace;color:var(--yellow)}.statement{font:clamp(28px,3.2vw,49px)/1.14 'VT323',monospace}.choice.picked{outline:8px solid var(--yellow);outline-offset:-15px}.choice.revealed-lie{background:#ad315a;outline:8px solid var(--yellow);outline-offset:-15px}.choice.revealed-lie:after{content:'★ THE LIE ★';color:var(--yellow);font:clamp(10px,1.2vw,16px)/1.5 'Press Start 2P',monospace}.choice.revealed-truth{opacity:.66}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0 18px}button{cursor:pointer;background:var(--yellow);color:var(--navy);border:3px solid white;box-shadow:4px 4px #070b19;font:11px/1.6 'Press Start 2P',monospace;padding:14px 18px}button.secondary{background:var(--cyan)}button:disabled{opacity:.4;cursor:default}.rounds{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:10px;max-width:900px;margin:0 auto}.mini{min-width:0;padding:15px 0;background:#2a3864;color:#fff;border-color:#7d91be}.mini.active{background:var(--pink);color:#11172f;border-color:white}.mini.completed{border-color:var(--yellow)}.note{text-align:center;font-size:22px;color:#b9c9e5;margin:15px 0}button:focus-visible,.choice:focus-visible,a:focus-visible{outline:5px solid var(--yellow);outline-offset:4px}@media(max-width:800px){.choices{grid-template-columns:1fr}.choice{min-height:155px;gap:10px;padding:12px}.statement{font-size:33px}.letter{font-size:16px}.rounds{grid-template-columns:repeat(5,1fr)}.shell{padding:14px}.choice.revealed-lie:after{font-size:10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><main class="shell"><div class="top"><a class="back" href="general-music.html">← GENERAL MUSIC</a><span class="count" id="count"></span></div><h1>TWO TRUTHS & A LIE</h1><p class="sub">Which statement about your teacher is NOT true? Pick A, B, or C!</p><section class="choices" id="choices" aria-label="Three statements"></section><div class="controls"><button class="secondary" id="reveal">★ REVEAL THE LIE</button><button id="reset">HIDE ANSWER</button></div><nav class="rounds" id="rounds" aria-label="Choose one of ten rounds"></nav><p class="note" id="note" aria-live="polite">Vote by pointing, raising your hand, or speaking.</p></main><script>
const data=[[["I play the guitar.","I direct middle school bands.","I play the bagpipes."],2],[["I have written a musical.","I have worked as a movie stunt performer.","One of my musicals was produced in New York City."],1],[["I am learning French.","I am learning Italian.","I speak fluent Japanese."],2],[["I have a son.","I have twelve children.","I have a wife."],1],[["I have played music with a singer.","I have never performed music with anyone else.","I play acoustic guitar."],1],[["I like science-fiction movies.","I have visited the moon.","I enjoy old movies."],1],[["I have lived in South Carolina.","I have lived in Connecticut.","I grew up in Antarctica."],2],[["I like to go running.","I have run across the entire United States.","I also play guitar."],1],[["I have made websites.","I have built tools for my band students.","I invented the internet."],2],[["I enjoy reading novels.","I have read books by Tolstoy.","I have won an Olympic gold medal in swimming."],2]];let current=0,revealed=false,picked=-1;const seen=new Set();const cards=document.getElementById('choices'),nav=document.getElementById('rounds');function render(){document.getElementById('count').textContent='ROUND '+String(current+1).padStart(2,'0')+' / 10';cards.replaceChildren();data[current][0].forEach((statement,i)=>{const el=document.createElement('button');el.type='button';el.className='choice'+(picked===i?' picked':'')+(revealed?(i===data[current][1]?' revealed-lie':' revealed-truth'):'');const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+i);const text=document.createElement('span');text.className='statement';text.textContent=statement;el.append(letter,text);el.onclick=()=>{if(!revealed){picked=i;render()}};cards.append(el)});nav.replaceChildren();data.forEach((_,i)=>{const b=document.createElement('button');b.className='mini'+(current===i?' active':'')+(seen.has(i)?' completed':'');b.textContent=String(i+1).padStart(2,'0');b.setAttribute('aria-label','Round '+(i+1));b.setAttribute('aria-current',current===i?'step':'false');b.onclick=()=>{current=i;revealed=false;picked=-1;render()};nav.append(b)});document.getElementById('note').textContent=revealed?'THE LIE IS '+String.fromCharCode(65+data[current][1])+'! The other two are true.':'Vote by pointing, raising your hand, or speaking.';document.getElementById('reveal').disabled=revealed}document.getElementById('reveal').onclick=()=>{revealed=true;seen.add(current);render()};document.getElementById('reset').onclick=()=>{revealed=false;picked=-1;render()};render();</script></body></html>
