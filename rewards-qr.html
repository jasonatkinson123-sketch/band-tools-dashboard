<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Derby Band Reward Arcade QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#130d1f,#3a225d 48%,#78402a 73%,#1a2317);color:#f5e6b8;font-family:"VT323",monospace}
.poster{width:min(850px,94vw);margin:24px auto;background:#171922;border:7px solid #08080a;padding:34px;text-align:center;box-shadow:12px 12px 0 #000;position:relative;overflow:hidden}
.poster:before{content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:120px;background:#21442b;clip-path:polygon(0 100%,0 55%,12% 72%,25% 51%,38% 80%,50% 54%,62% 76%,75% 48%,88% 72%,100% 58%,100% 100%)}
.content{position:relative;z-index:1}
.eyebrow{font-family:"Press Start 2P";font-size:11px;line-height:1.6;color:#67d7f0}
.title{font-family:"Press Start 2P";font-size:clamp(36px,7vw,72px);line-height:1.2;color:#ffcf5a;text-shadow:4px 4px 0 #000;margin:18px 0}
.sub{font-size:30px;color:#f5e6b8;margin:0 auto 20px}
.status{display:inline-block;border:3px solid #08080a;background:#f2b632;color:#08080a;font-family:"Press Start 2P";font-size:10px;line-height:1.5;padding:10px 14px;box-shadow:4px 4px 0 #000}
.qr{width:min(370px,80vw);background:#fff;border:7px solid #08080a;padding:16px;margin:26px auto;box-shadow:9px 9px 0 #d94f70}
.note{font-size:24px;line-height:1.1;margin:18px auto;max-width:620px}
.url{font-family:"Press Start 2P";font-size:9px;line-height:1.6;color:#67d7f0;word-break:break-word;margin-bottom:80px}
@media print{body{background:#fff}.poster{width:100%;margin:0;box-shadow:none}}
</style>
</head>
<body>
<main class="poster"><div class="content">
<div class="eyebrow">DERBY BAND · CHARACTER POINTS</div>
<div class="title">REWARD<br>ARCADE</div>
<div class="status">PLAYER READY</div>
<div class="sub">SCAN · SELECT PLAYER · UNLOCK A POWER-UP</div>
<img class="qr" src="rewards-qr.svg" alt="QR code for Derby Band Reward Arcade">
<p class="note">Redemptions are approved by Mr. Atkinson before Character Points are deducted.</p>
<div class="url">jasonatkinson123-sketch.github.io/band-tools-dashboard/rewards.html</div>
</div></main>
</body>
</html>
