<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>This or That | General Music</title><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#10172f;color:white;font-family:'VT323',monospace;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:32px 32px}.shell{max-width:1300px;margin:auto;padding:22px 24px 36px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.back{color:#5de4e7;text-decoration:none;font:11px/1.6 'Press Start 2P',monospace;border:3px solid #5de4e7;padding:13px}.round{font:12px 'Press Start 2P',monospace;color:#ffd447}h1{text-align:center;font:clamp(23px,4vw,46px)/1.5 'Press Start 2P',monospace;color:#ffd447;text-shadow:5px 5px #653c83;margin:22px 0 8px}.hint{text-align:center;font-size:clamp(23px,2.7vw,34px);color:#c6d6ee;margin:8px 0 20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:stretch}.choice{border:6px solid white;min-height:clamp(260px,48vh,540px);box-shadow:9px 9px #070b19;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;cursor:pointer;transition:transform .1s}.choice.a{background:#264e85}.choice.b{background:#813e70}.letter{font:clamp(23px,3vw,42px) 'Press Start 2P',monospace;color:#ffd447;margin-bottom:30px}.label{font:clamp(30px,5vw,70px)/1.2 'VT323',monospace;overflow-wrap:anywhere}.choice.chosen{outline:9px solid #ffd447;outline-offset:-16px}.choice.chosen .label:after{content:' ✓';color:#ffd447}.vs{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);border:5px solid #ffd447;background:#11172f;padding:18px;font:18px 'Press Start 2P',monospace;pointer-events:none}.stage{position:relative}.nav{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:30px}button{font:12px/1.5 'Press Start 2P',monospace;border:4px solid white;padding:17px 22px;background:#ffd447;color:#11172f;cursor:pointer;box-shadow:5px 5px #060b1a}button.secondary{background:#5de4e7}button:disabled{opacity:.4;cursor:default}button:focus-visible,.choice:focus-visible{outline:5px solid #ffd447;outline-offset:4px}.footer{text-align:center;color:#b8c9e8;font-size:23px;margin-top:24px}@media(max-width:700px){.shell{padding:15px}.choices{gap:12px}.choice{min-height:300px;padding:10px;border-width:4px}.label{font-size:clamp(26px,7vw,45px)}.letter{font-size:18px}.vs{font-size:10px;padding:9px;top:55%}.nav button{font-size:10px;padding:13px}h1{font-size:22px}}</style></head><body><main class="shell"><div class="top"><a class="back" href="general-music.html">← GENERAL MUSIC</a><span class="round" id="round">ROUND 01 / 12</span></div><h1>THIS OR THAT?</h1><p class="hint">Choose your favorite! Point, vote, or use your voice.</p><div class="stage"><div class="choices"><div class="choice a" id="a" tabindex="0" role="button" aria-label="Choose A"><span class="letter">PLAYER A</span><span class="label" id="labelA"></span></div><div class="choice b" id="b" tabindex="0" role="button" aria-label="Choose B"><span class="letter">PLAYER B</span><span class="label" id="labelB"></span></div></div><span class="vs">VS</span></div><div class="nav"><button class="secondary" id="prev">◀ BACK</button><button id="next">NEXT ROUND ▶</button><button class="secondary" id="restart">↻ RESTART</button></div><div class="footer">No wrong answers. Everyone can participate.</div></main><script>
const rounds=[['Music','Movies'],['Video Games','Sports'],['Headphones','Speakers'],['Fast Music','Slow Music'],['Drums','Guitar'],['Singing','Dancing'],['Rap','Rock'],['Happy Music','Scary Music'],['Concert','Movie Theater'],['Make Music','Listen to Music'],['Loud Music','Quiet Music'],['Play an Instrument','Be a DJ']];let i=0,selected='';const a=document.getElementById('a'),b=document.getElementById('b');function render(){document.getElementById('labelA').textContent=rounds[i][0];document.getElementById('labelB').textContent=rounds[i][1];document.getElementById('round').textContent='ROUND '+String(i+1).padStart(2,'0')+' / '+rounds.length;a.classList.toggle('chosen',selected==='a');b.classList.toggle('chosen',selected==='b');document.getElementById('prev').disabled=i===0;document.getElementById('next').textContent=i===rounds.length-1?'FINISH ✓':'NEXT ROUND ▶'}function pick(v){selected=selected===v?'':v;render()}a.onclick=()=>pick('a');b.onclick=()=>pick('b');[a,b].forEach(el=>el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}});document.getElementById('next').onclick=()=>{if(i<rounds.length-1){i++;selected='';render()}else{alert('GAME COMPLETE! Great choices, everyone.')}};document.getElementById('prev').onclick=()=>{if(i>0){i--;selected='';render()}};document.getElementById('restart').onclick=()=>{i=0;selected='';render()};render();</script></body></html>
