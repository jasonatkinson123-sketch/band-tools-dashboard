<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simon Says: Sound Edition</title><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090e24;color:white;font-family:'VT323',monospace;background-image:radial-gradient(ellipse at 50% 20%,#293b75,transparent 70%)}main{max-width:860px;margin:auto;padding:18px;text-align:center}.back{display:inline-block;float:left;font:10px/1.6 'Press Start 2P',monospace;text-decoration:none;color:#5de4e7;border:3px solid #5de4e7;padding:12px}.clearfix{clear:both}h1{font:clamp(19px,3vw,30px)/1.6 'Press Start 2P',monospace;color:#ffd447;text-shadow:4px 4px #7d3f8d;margin:24px 0 5px}p{font-size:27px;color:#cdd8f0;margin:10px}.score{display:flex;justify-content:center;gap:30px;font:11px/2 'Press Start 2P',monospace;color:#ffd447;margin:18px}.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:min(520px,90vw);margin:16px auto;padding:18px;background:#171d3d;border:7px solid #788ac4;box-shadow:9px 9px #030715}.pad{aspect-ratio:1.35;border:6px solid #070b1c;cursor:pointer;filter:brightness(.75);box-shadow:inset 0 -12px #0004;transition:filter .08s,transform .08s}.pad[data-i="0"]{background:#ed4567}.pad[data-i="1"]{background:#45c6ed}.pad[data-i="2"]{background:#f5ce42}.pad[data-i="3"]{background:#55d27c}.pad.lit{filter:brightness(1.6);transform:scale(1.035);box-shadow:0 0 30px currentColor}.pad:focus-visible{outline:5px solid white}.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:15px}button.control{font:11px/1.6 'Press Start 2P',monospace;padding:14px;background:#ffd447;color:#10172f;border:3px solid white;box-shadow:4px 4px #030715;cursor:pointer}button.control:disabled{opacity:.45;cursor:default}#status{font:clamp(12px,2vw,18px)/1.7 'Press Start 2P',monospace;color:#5de4e7;min-height:60px;margin:15px 0}.note{font-size:21px;color:#9aaed4}@media(max-width:600px){main{padding:12px}.board{gap:10px;padding:10px}.pad{aspect-ratio:1}.score{gap:14px;font-size:9px}.back{float:none}}</style></head><body><main><a class="back" href="arcade.html">← ARCADE</a><div class="clearfix"></div><h1>SIMON SAYS<br>SOUND EDITION</h1><p>Watch the lights. Listen to the notes. Repeat!</p><div class="score"><span id="level">LEVEL 00</span><span id="best">BEST 00</span></div><div class="board" aria-label="Four musical sound pads"><button class="pad" data-i="0" aria-label="Red note"></button><button class="pad" data-i="1" aria-label="Blue note"></button><button class="pad" data-i="2" aria-label="Yellow note"></button><button class="pad" data-i="3" aria-label="Green note"></button></div><div id="status" role="status" aria-live="polite">PRESS START TO PLAY</div><div class="controls"><button class="control" id="start">▶ START GAME</button><button class="control" id="sound">♪ SOUND ON</button></div><p class="note">Play alone or as a class. Tap the pads or use keys 1–4.</p></main><script>
const pads=[...document.querySelectorAll('.pad')],freq=[261.63,329.63,392,523.25];let ctx,sequence=[],index=0,locked=true,playing=false,soundOn=true,token=0,best=0;try{best=Number(localStorage.getItem('simonSoundBest')||0)}catch(e){}const status=document.getElementById('status');function update(){document.getElementById('level').textContent='LEVEL '+String(sequence.length).padStart(2,'0');document.getElementById('best').textContent='BEST '+String(best).padStart(2,'0')}function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}function note(i,duration=340){if(!soundOn)return;try{audio();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='triangle';osc.frequency.value=freq[i];gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.19,ctx.currentTime+.025);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration/1000);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+duration/1000+.03)}catch(e){}}function flash(i,d=340){pads[i].classList.add('lit');note(i,d);setTimeout(()=>pads[i].classList.remove('lit'),d)}const wait=ms=>new Promise(r=>setTimeout(r,ms));async function show(){const mine=token;locked=true;playing=true;status.textContent='WATCH & LISTEN...';await wait(600);for(const i of sequence){if(mine!==token)return;flash(i,400);await wait(640)}if(mine!==token)return;playing=false;index=0;locked=false;status.textContent='YOUR TURN! REPEAT THE PATTERN'}function next(){sequence.push(Math.floor(Math.random()*4));update();show()}function start(){token++;sequence=[];index=0;locked=true;playing=false;status.textContent='GET READY!';next()}function input(i){if(locked||playing)return;flash(i,230);if(i!==sequence[index]){locked=true;status.textContent='NOT QUITE! PRESS START TO TRY AGAIN';return}index++;if(index===sequence.length){locked=true;status.textContent='GREAT JOB! NEXT LEVEL...';if(sequence.length>best){best=sequence.length;try{localStorage.setItem('simonSoundBest',best)}catch(e){}update()}const roundToken=token;setTimeout(()=>{if(locked&&token===roundToken)next()},850)}}pads.forEach((p,i)=>p.onclick=()=>input(i));document.getElementById('start').onclick=start;document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'♪ SOUND ON':'♪ SOUND OFF';if(soundOn)audio()};document.addEventListener('keydown',e=>{if(['1','2','3','4'].includes(e.key)&&!e.repeat)input(Number(e.key)-1)});update();
</script></body></html>
