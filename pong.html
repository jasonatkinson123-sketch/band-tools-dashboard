<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <title>Derby Band Pong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#08080a;--bg:#0b0b10;--panel:#151823;--cream:#f5e6b8;--gold:#f2b632;--cyan:#67d7f0;--orange:#e06a2c;--green:#2d6b3f}
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;color:var(--cream);font-family:"VT323",monospace;font-size:24px;background:linear-gradient(180deg,#130d1f 0%,#24143c 48%,#1a2317 100%);min-height:100vh}
    .wrap{width:min(900px,calc(100% - 18px));margin:0 auto;padding:16px 0 30px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
    .brand{font-family:"Press Start 2P",monospace;font-size:clamp(18px,4vw,30px);line-height:1.3;color:var(--gold)}
    .sub{color:#d7cda8;font-size:20px}
    .back,.btn,.touch{
      border:3px solid var(--ink);background:var(--panel);color:var(--cream);text-decoration:none;
      font-family:"Press Start 2P",monospace;font-size:10px;line-height:1.4;padding:10px 13px;box-shadow:4px 4px 0 #000;cursor:pointer
    }
    .btn.primary{background:var(--gold);color:var(--ink)}
    .game-shell{background:#08090d;border:4px solid var(--ink);box-shadow:8px 8px 0 #000;padding:10px}
    canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#050608;touch-action:none}
    .hud{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
    .score{font-family:"Press Start 2P",monospace;font-size:12px;color:var(--cyan)}
    .message{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--gold);min-height:1.4em}
    .controls{display:flex;gap:10px;flex-wrap:wrap}
    .touch-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .touch{min-height:58px;background:#222633;color:var(--cream);font-size:14px}
    .instructions{margin-top:14px;padding:14px;border:2px solid #3b3d48;background:#11131a;color:#d8ccb0}
    .instructions b{color:var(--gold)}
    @media(max-width:640px){.wrap{width:min(100% - 10px,900px)}.touch-row{display:grid}.back{width:100%;text-align:center}.top{align-items:flex-start}.controls{width:100%}.btn{flex:1}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div>
        <div class="brand">DERBY BAND PONG</div>
        <div class="sub">Arcade side quest · first to 5 wins</div>
      </div>
      <a class="back" href="rewards.html">← REWARD ARCADE</a>
    </div>

    <section class="game-shell" aria-label="Pong game">
      <canvas id="game" width="960" height="540" aria-label="Pong playing field"></canvas>
      <div class="hud">
        <div class="score" id="score">PLAYER 0 · CPU 0</div>
        <div class="message" id="message" aria-live="polite">PRESS START</div>
        <div class="controls">
          <button class="btn primary" id="startBtn" type="button">START</button>
          <button class="btn" id="resetBtn" type="button">RESET</button>
        </div>
      </div>
      <div class="touch-row">
        <button class="touch" id="upBtn" type="button">▲ UP</button>
        <button class="touch" id="downBtn" type="button">▼ DOWN</button>
      </div>
    </section>

    <div class="instructions">
      <b>Controls:</b> W/S or ↑/↓. You can also drag/tap on the game field or use the big buttons. The computer controls the right paddle.
    </div>
  </main>

<script>
(()=>{
  "use strict";
  const canvas=document.getElementById("game");
  const ctx=canvas.getContext("2d");
  const scoreEl=document.getElementById("score");
  const messageEl=document.getElementById("message");
  const startBtn=document.getElementById("startBtn");
  const resetBtn=document.getElementById("resetBtn");
  const upBtn=document.getElementById("upBtn");
  const downBtn=document.getElementById("downBtn");

  const W=canvas.width,H=canvas.height;
  const paddleW=18,paddleH=110;
  const player={x:28,y:H/2-paddleH/2,score:0};
  const cpu={x:W-46,y:H/2-paddleH/2,score:0};
  const ball={x:W/2,y:H/2,r:11,vx:6,vy:3};
  let running=false,raf=0,last=0;
  const keys={up:false,down:false};
  let touchUp=false,touchDown=false;

  function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
  function resetBall(dir=1){
    ball.x=W/2;ball.y=H/2;
    const angle=(Math.random()*.9-.45);
    const speed=6.2;
    ball.vx=Math.cos(angle)*speed*dir;
    ball.vy=Math.sin(angle)*speed;
  }
  function updateScore(){
    scoreEl.textContent="PLAYER "+player.score+" · CPU "+cpu.score;
  }
  function resetGame(){
    cancelAnimationFrame(raf);
    running=false;player.score=0;cpu.score=0;
    player.y=H/2-paddleH/2;cpu.y=H/2-paddleH/2;
    resetBall(Math.random()<.5?-1:1);
    updateScore();messageEl.textContent="PRESS START";startBtn.textContent="START";draw();
  }
  function serveAfterPoint(dir){
    running=false;resetBall(dir);draw();
    if(player.score>=5||cpu.score>=5){
      messageEl.textContent=player.score>=5?"YOU WIN!":"CPU WINS";
      startBtn.textContent="PLAY AGAIN";
      return;
    }
    messageEl.textContent="POINT! PRESS START";
    startBtn.textContent="SERVE";
  }
  function paddleHit(p){
    return ball.x+ball.r>p.x && ball.x-ball.r<p.x+paddleW && ball.y+ball.r>p.y && ball.y-ball.r<p.y+paddleH;
  }
  function update(dt){
    const step=Math.min(dt/16.667,2);
    const speed=8*step;
    if(keys.up||touchUp)player.y-=speed;
    if(keys.down||touchDown)player.y+=speed;
    player.y=clamp(player.y,0,H-paddleH);

    const target=ball.y-paddleH/2;
    const cpuSpeed=5.2*step;
    cpu.y+=clamp(target-cpu.y,-cpuSpeed,cpuSpeed);
    cpu.y=clamp(cpu.y,0,H-paddleH);

    ball.x+=ball.vx*step;ball.y+=ball.vy*step;
    if(ball.y-ball.r<=0&&ball.vy<0){ball.y=ball.r;ball.vy*=-1}
    if(ball.y+ball.r>=H&&ball.vy>0){ball.y=H-ball.r;ball.vy*=-1}

    if(ball.vx<0&&paddleHit(player)){
      ball.x=player.x+paddleW+ball.r;
      const offset=(ball.y-(player.y+paddleH/2))/(paddleH/2);
      ball.vx=Math.abs(ball.vx)*1.04;
      ball.vy+=offset*2.2;
    }
    if(ball.vx>0&&paddleHit(cpu)){
      ball.x=cpu.x-ball.r;
      const offset=(ball.y-(cpu.y+paddleH/2))/(paddleH/2);
      ball.vx=-Math.abs(ball.vx)*1.03;
      ball.vy+=offset*1.8;
    }

    if(ball.x<-30){cpu.score++;updateScore();serveAfterPoint(-1)}
    else if(ball.x>W+30){player.score++;updateScore();serveAfterPoint(1)}
  }
  function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
  function draw(){
    ctx.fillStyle="#050608";ctx.fillRect(0,0,W,H);

    ctx.fillStyle="#15231a";
    ctx.beginPath();
    ctx.moveTo(0,H);ctx.lineTo(0,H-92);ctx.lineTo(90,H-124);ctx.lineTo(170,H-76);ctx.lineTo(260,H-116);ctx.lineTo(360,H-70);ctx.lineTo(475,H-122);ctx.lineTo(590,H-82);ctx.lineTo(710,H-116);ctx.lineTo(820,H-72);ctx.lineTo(W,H-105);ctx.lineTo(W,H);ctx.closePath();ctx.fill();

    ctx.strokeStyle="#3a3d48";ctx.lineWidth=5;ctx.setLineDash([16,18]);ctx.beginPath();ctx.moveTo(W/2,20);ctx.lineTo(W/2,H-20);ctx.stroke();ctx.setLineDash([]);

    rect(player.x,player.y,paddleW,paddleH,"#f2b632");
    rect(cpu.x,cpu.y,paddleW,paddleH,"#67d7f0");
    ctx.fillStyle="#f5e6b8";ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();

    ctx.font='48px "VT323", monospace';ctx.textAlign="center";
    ctx.fillStyle="rgba(245,230,184,.18)";
    ctx.fillText(String(player.score),W*.36,65);ctx.fillText(String(cpu.score),W*.64,65);
  }
  function loop(t){
    if(!running)return;
    const dt=last?t-last:16.667;last=t;
    update(dt);draw();
    if(running)raf=requestAnimationFrame(loop);
  }
  function start(){
    if(player.score>=5||cpu.score>=5){player.score=0;cpu.score=0;updateScore();resetBall(Math.random()<.5?-1:1)}
    if(running){running=false;cancelAnimationFrame(raf);messageEl.textContent="PAUSED";startBtn.textContent="RESUME";return}
    running=true;last=0;messageEl.textContent="GAME ON";startBtn.textContent="PAUSE";raf=requestAnimationFrame(loop);
  }

  function pointerMove(e){
    const r=canvas.getBoundingClientRect();
    const y=(e.clientY-r.top)*(H/r.height);
    player.y=clamp(y-paddleH/2,0,H-paddleH);draw();
  }
  canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture?.(e.pointerId);pointerMove(e)});
  canvas.addEventListener("pointermove",e=>{if(e.buttons||e.pointerType==="touch")pointerMove(e)});

  function setKey(e,on){
    if(["ArrowUp","ArrowDown","w","W","s","S"].includes(e.key)){
      e.preventDefault();
      if(e.key==="ArrowUp"||e.key==="w"||e.key==="W")keys.up=on;
      if(e.key==="ArrowDown"||e.key==="s"||e.key==="S")keys.down=on;
    }
  }
  window.addEventListener("keydown",e=>setKey(e,true));
  window.addEventListener("keyup",e=>setKey(e,false));

  const hold=(btn,dir)=>{
    btn.addEventListener("pointerdown",e=>{e.preventDefault();btn.setPointerCapture?.(e.pointerId);if(dir==="up")touchUp=true;else touchDown=true});
    const off=()=>{if(dir==="up")touchUp=false;else touchDown=false};
    btn.addEventListener("pointerup",off);btn.addEventListener("pointercancel",off);btn.addEventListener("lostpointercapture",off);
  };
  hold(upBtn,"up");hold(downBtn,"down");
  startBtn.addEventListener("click",start);
  resetBtn.addEventListener("click",resetGame);
  resetGame();
})();
</script>
</body>
</html>
