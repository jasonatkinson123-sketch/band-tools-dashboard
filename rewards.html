<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5b2aa8" />
  <title>Derby Band Prize Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rewards.css?v=20260929-1" />
</head>
<body>
  <div class="sky-burst one" aria-hidden="true"></div>
  <div class="sky-burst two" aria-hidden="true"></div>
  <div id="confetti" class="confetti-layer" aria-hidden="true"></div>

  <main class="shell">
    <header class="hero">
      <div class="ticket-logo" aria-hidden="true"><span>★</span></div>
      <div class="hero-copy">
        <p class="kicker">DERBY BAND · CHARACTER CASH</p>
        <h1>THE PRIZE COUNTER</h1>
        <p class="tagline">You earned it. Pick something good.</p>
      </div>
      <div class="coin-stack" aria-hidden="true">
        <span>CC</span><span>CC</span><span>CC</span>
      </div>
    </header>

    <section class="marquee" aria-label="Reward shop status">
      <div class="bulbs" aria-hidden="true"></div>
      <div class="marquee-copy"><span>★</span> REWARDS ARE OPEN <span>★</span> REQUESTS NEED TEACHER APPROVAL <span>★</span></div>
      <div class="bulbs" aria-hidden="true"></div>
    </section>

    <section id="app" class="stage" aria-live="polite"></section>

    <footer class="footer">
      <div>Character Cash is deducted only after Mr. Atkinson approves the redemption.</div>
      <a href="./" class="tiny-link">Band Tools</a>
    </footer>
  </main>

  <script src="rewards-config.js?v=20260929-1"></script>
  <script src="rewards.js?v=20260929-1"></script>
</body>
</html>
